# One-click deploy on Render (free web service). Redis: create a free Render Key Value instance and paste its internal URL into REDIS_URL.
services:
  - type: web
    name: shopify-hubspot-sync
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_PORTAL_ID
        sync: false
